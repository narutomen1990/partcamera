 <!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสั่งจองอะไหล่กล้อง</title>
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwG4hwyDZxbIseNBh55CZle_-fn2zFFWKzZU12xk_jlMoAKrqw0a0RmPhYZEGJqXRTiug/exec">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: #667eea;
      display: flex; justify-content: center; align-items: center;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: white; margin-top: 20px; }
    a { color: white; margin-top: 10px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>กำลังเปิดระบบ...</p>
  <a href="https://script.google.com/macros/s/AKfycbwG4hwyDZxbIseNBh55CZle_-fn2zFFWKzZU12xk_jlMoAKrqw0a0RmPhYZEGJqXRTiug/exec">

    window.location.replace("https://script.google.com/macros/s/AKfycbwG4hwyDZxbIseNBh55CZle_-fn2zFFWKzZU12xk_jlMoAKrqw0a0RmPhYZEGJqXRTiug/exec");
  </script>
